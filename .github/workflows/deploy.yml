name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Find output and SPA fallback
        id: out
        run: |
          if [ -f dist/client/index.html ]; then
            OUT="dist/client"
          elif [ -f dist/index.html ]; then
            OUT="dist"
          elif [ -f .output/public/index.html ]; then
            OUT=".output/public"
          else
            echo "No index.html found"
            find . -name "index.html" | head -30
            ls -la
            ls -la dist 2>/dev/null || true
            ls -la .output 2>/dev/null || true
            exit 1
          fi
          echo "path=$OUT" >> $GITHUB_OUTPUT
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "Using output: $OUT"
          ls -la "$OUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
