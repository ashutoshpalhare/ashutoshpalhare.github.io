name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Prepare static output for GitHub Pages
        id: out
        run: |
          echo "=== dist structure ==="
          find dist -type f | head -50 || true

          # Prefer dist/client
          if [ -d dist/client ]; then
            OUT="dist/client"
          elif [ -d dist ]; then
            OUT="dist"
          else
            echo "No dist folder"
            exit 1
          fi

          echo "Using: $OUT"
          ls -la "$OUT"

          # SPA mode creates _shell.html (not index.html)
          if [ -f "$OUT/_shell.html" ]; then
            cp "$OUT/_shell.html" "$OUT/index.html"
            cp "$OUT/_shell.html" "$OUT/404.html"
            echo "Created index.html + 404.html from _shell.html"
          elif [ -f "$OUT/index.html" ]; then
            cp "$OUT/index.html" "$OUT/404.html"
            echo "Using existing index.html"
          else
            echo "No _shell.html or index.html found in $OUT"
            find "$OUT" -name "*.html" || true
            exit 1
          fi

          touch "$OUT/.nojekyll"
          echo "path=$OUT" >> $GITHUB_OUTPUT
          ls -la "$OUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
